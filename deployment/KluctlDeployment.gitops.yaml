apiVersion: gitops.kluctl.io/v1beta1
kind: KluctlDeployment
metadata:
  name: flowworld
  namespace: yoga
spec:
  interval: 5m
  source:
    git:
      url: https://github.com/insanity54/flowworld
      path: 
  target: production
  context: default
  # let it automatically clean up orphan KluctlDeployment resources
  prune: true
  delete: true